name: Verify

on:
  push:
    branches: ["main", "feat/source-verification-foundation", "ci/**", "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Install browser for workspace acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify workspace navigation and records
        run: pnpm test:ui
